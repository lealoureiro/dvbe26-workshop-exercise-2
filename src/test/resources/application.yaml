# Test configuration.
#
# No datasource is declared here on purpose. Integration (*IT) and acceptance
# (*AT) tests supply a real PostgreSQL through Testcontainers, wired by
# @ServiceConnection (design D5). An in-memory substitute is not permitted,
# not even as a fallback, because the guarantees under test — sequence
# behaviour and a case-insensitive unique constraint — are engine-specific.
spring:
  # Refuse to swap a configured DataSource for an embedded one in test slices.
  # This is the structural guard that keeps D5 true as tests are added.
  test:
    database:
      replace: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

# Reconciliation defaults to off for the whole test suite (design D9's kill
# switch). Without this, every @SpringBootTest context would schedule a real
# outbound call to the third-party source at start-up — flaky, slow, and
# irrelevant to what most of these tests verify. Tests that specifically cover
# greek-gods-upstream-sync override this property where they need it on.
greek-gods:
  sync:
    enabled: false
